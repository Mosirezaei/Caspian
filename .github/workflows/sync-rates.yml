name: Sync exchange rates

# Scheduling now lives on cron-job.org (two jobs: every 2 minutes during
# 08:00-20:00 Yerevan time, hourly outside it), configured with the exact
# same CRON_SECRET bearer token this workflow used. The automatic schedule
# trigger below is intentionally removed so this workflow doesn't ALSO fire
# and double the real request count against the paid alanchand quota.
# workflow_dispatch is kept for manual runs/testing only.
on:
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call sync-rates endpoint
        run: |
          curl -sf -X GET "https://caspian.am/api/cron/sync-rates" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
