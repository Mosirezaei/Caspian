name: Sync exchange rates

on:
  schedule:
    # Every 5 minutes -- the shortest interval GitHub Actions supports.
    # The route itself (app/api/cron/sync-rates/route.js) only actually
    # calls alanchand on every tick during 08:00-20:00 Yerevan time; outside
    # that window it throttles to once an hour. This keeps monthly request
    # usage around ~4,700 of the account's 15,000/month paid quota while
    # maximizing freshness during business hours.
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call sync-rates endpoint
        run: |
          curl -sf -X GET "https://caspian.am/api/cron/sync-rates" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
